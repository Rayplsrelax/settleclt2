name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Audit all dependencies
        run: pnpm audit --audit-level high
        continue-on-error: true
        # The remaining moderate advisory is documented in
        # .github/DEPENDENCY_SECURITY_EXCEPTIONS.md and is development-only.

      - name: Run tests
        run: pnpm run test
        env:
          # Public-format placeholder required by the existing Mixpanel config tests.
          VITE_MIXPANEL_TOKEN: "00000000000000000000000000000000"

      - name: Type-check
        run: pnpm run check

      - name: Build production artifacts
        run: pnpm run build
        env:
          VITE_OAUTH_PORTAL_URL: https://oauth.example.invalid
          VITE_APP_ID: ci-verification
          VITE_ANALYTICS_ENDPOINT: https://analytics.example.invalid
          VITE_ANALYTICS_WEBSITE_ID: ci-verification
          VITE_GOOGLE_SITE_VERIFICATION: ci-verification
          VITE_FRONTEND_FORGE_API_URL: https://forge.example.invalid
