name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.4.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Run tests
        run: pnpm run test
        env:
          # Public-format placeholder required by the existing Mixpanel config tests.
          VITE_MIXPANEL_TOKEN: 00000000000000000000000000000000

      - name: Type-check
        run: pnpm run check

      - name: Build production artifacts
        run: pnpm run build
        env:
          VITE_OAUTH_PORTAL_URL: https://oauth.example.invalid
          VITE_APP_ID: ci-verification
          VITE_ANALYTICS_ENDPOINT: https://analytics.example.invalid
          VITE_ANALYTICS_WEBSITE_ID: ci-verification
          VITE_GOOGLE_SITE_VERIFICATION: ci-verification
          VITE_FRONTEND_FORGE_API_URL: https://forge.example.invalid
