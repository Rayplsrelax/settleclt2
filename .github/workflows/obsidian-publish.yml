name: Obsidian → Settle CLT Publisher

# Triggers whenever files in the "Blog/" folder of the vault repo are pushed.
# The vault repo is a SEPARATE private GitHub repo (your Obsidian vault).
# This workflow lives in the SETTLE CLT repo and is called via repository_dispatch
# OR you can copy this file into your vault repo and call the API directly.
#
# ── Recommended setup ───────────────────────────────────────────────────────
# 1. Add this file to your VAULT repo at .github/workflows/publish-to-settleclt.yml
# 2. Add these secrets to your VAULT repo (Settings → Secrets → Actions):
#    - SETTLECLT_PUBLISH_SECRET  (same value as OBSIDIAN_PUBLISH_SECRET in Settle CLT)
#    - SETTLECLT_API_URL         (e.g. https://settleclt.com)
# 3. Push any note with `publish: true` in its frontmatter to trigger publishing.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]
    paths:
      - "Blog/**/*.md"
      - "blog/**/*.md"
      - "Posts/**/*.md"
      - "posts/**/*.md"
      - "settle-clt/**/*.md"

jobs:
  publish:
    name: Publish changed notes to Settle CLT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need parent commit to detect changed files

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install gray-matter (frontmatter parser)
        run: npm install gray-matter

      - name: Find changed Markdown files
        id: changed
        run: |
          # Get list of added/modified .md files in Blog/ or Posts/ folders
          git diff --name-only --diff-filter=AM HEAD~1 HEAD -- "*.md" | \
            grep -E "^(Blog|blog|Posts|posts|settle-clt)/" > changed_files.txt || true
          echo "Changed files:"
          cat changed_files.txt
          echo "count=$(wc -l < changed_files.txt | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Parse and publish each note
        if: steps.changed.outputs.count != '0'
        env:
          SETTLECLT_API_URL: ${{ secrets.SETTLECLT_API_URL }}
          SETTLECLT_PUBLISH_SECRET: ${{ secrets.SETTLECLT_PUBLISH_SECRET }}
        run: |
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const matter = require("gray-matter");

          const apiUrl = process.env.SETTLECLT_API_URL?.replace(/\/$/, "");
          const secret = process.env.SETTLECLT_PUBLISH_SECRET;

          if (!apiUrl || !secret) {
            console.error("❌ Missing SETTLECLT_API_URL or SETTLECLT_PUBLISH_SECRET secrets");
            process.exit(1);
          }

          const changedFiles = fs.readFileSync("changed_files.txt", "utf8")
            .split("\n")
            .map(f => f.trim())
            .filter(Boolean);

          let published = 0;
          let skipped = 0;
          let errors = 0;

          for (const filePath of changedFiles) {
            if (!fs.existsSync(filePath)) {
              console.log(`⏭  Skipping deleted file: ${filePath}`);
              skipped++;
              continue;
            }

            const raw = fs.readFileSync(filePath, "utf8");
            const { data: fm, content } = matter(raw);

            // Only publish notes explicitly tagged with publish: true
            if (!fm.publish) {
              console.log(`⏭  Skipping (no publish: true): ${filePath}`);
              skipped++;
              continue;
            }

            // Derive slug from frontmatter or filename
            const slug = fm.slug ||
              path.basename(filePath, ".md")
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "");

            const payload = {
              slug,
              title: fm.title || path.basename(filePath, ".md"),
              content: content.trim(),
              excerpt: fm.excerpt || fm.description || null,
              category: fm.category || fm.tags?.[0] || "Charlotte Guide",
              coverImage: fm.coverImage || fm.cover_image || fm.image || null,
              status: fm.status === "draft" ? "draft" : "published",
              readTime: fm.readTime || fm.read_time || null,
              publishedAt: fm.date || fm.publishedAt || new Date().toISOString(),
            };

            console.log(`📤 Publishing: "${payload.title}" → /${payload.slug}`);

            try {
              const response = await fetch(`${apiUrl}/api/obsidian/publish`, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${secret}`,
                },
                body: JSON.stringify(payload),
              });

              const result = await response.json();

              if (response.ok) {
                console.log(`✅ ${result.action}: "${payload.title}" (/${payload.slug})`);
                published++;
              } else {
                console.error(`❌ Failed to publish "${payload.title}": ${result.error}`);
                errors++;
              }
            } catch (err) {
              console.error(`❌ Network error for "${payload.title}": ${err.message}`);
              errors++;
            }
          }

          console.log(`\n📊 Summary: ${published} published, ${skipped} skipped, ${errors} errors`);
          if (errors > 0) process.exit(1);
          EOF

      - name: No publishable notes found
        if: steps.changed.outputs.count == '0'
        run: echo "ℹ️  No Blog/ or Posts/ Markdown files changed in this push."
